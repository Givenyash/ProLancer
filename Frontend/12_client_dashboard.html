<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Dashboard | ProLancer</title>
    <link rel="stylesheet" href="12_client_dashboard.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar">
      <div class="logo">
        <i class="fa-solid fa-rocket"></i>
        ProLancer
      </div>

      <div class="search-box">
        <input
          type="text"
          placeholder="Search freelancers..."
          id="searchInput"
          onkeypress="if (event.key === 'Enter') searchFreelancer();"
        />

        <button onclick="searchFreelancer()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div class="nav-links">
        <button
          class="seller-btn"
          onclick="window.location.href = '16_marketplace.html'"
        >
          Marketplace
        </button>

        <button
          class="seller-btn"
          onclick="window.location.href = '18_buyer_orders.html'"
        >
          My Orders
        </button>

        <button class="seller-btn" onclick="becomeSeller()">
          Become Seller
        </button>

        <button class="logout-btn" onclick="logout()">Logout</button>

        <button class="dark-btn" onclick="toggleTheme()">🌙</button>
      </div>
    </nav>

    <!-- Welcome -->

    <section class="welcome">
      <h1>
        Welcome,
        <span id="clientName">Client</span>
        👋
      </h1>

      <p>Find the perfect freelancer for your next project.</p>
    </section>

    <!-- Categories -->

    <section class="categories">
      <h2>Browse Categories</h2>

      <div class="category-grid">
        <div class="category-card" onclick="goCategory('Web Development')">
          💻
          <h3>Web Development</h3>
        </div>

        <div class="category-card" onclick="goCategory('Content Writing')">
          📱
          <h3>Content Writing</h3>
        </div>

        <div class="category-card" onclick="goCategory('Graphic Design')">
          🎨
          <h3>Graphic Design</h3>
        </div>

        <div class="category-card" onclick="goCategory('AI Services')">
          🤖
          <h3>AI Services</h3>
        </div>
      </div>
    </section>

    <!-- Freelancers -->

    <section class="freelancers">
      <h2>Featured Freelancers</h2>

      <div class="freelancer-grid" id="featuredFreelancers"></div>
    </section>

    <!-- Recently Viewed -->

    <section class="freelancers">
      <h2>Recently Viewed</h2>

      <div class="freelancer-grid" id="recentContainer"></div>
    </section>

    <!-- Recently Added Gigs -->

    <section class="freelancers">
      <h2>Recently Added Gigs</h2>

      <div class="freelancer-grid" id="recentGigs"></div>
    </section>

    <script src="12_client_dashboard.js"></script>
  </body>
</html>

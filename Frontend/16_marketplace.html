<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Marketplace | ProLancer</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Explore Gigs</h2>

      <div class="row mb-4">
        <div class="col-md-8">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search gigs..."
            onkeyup="searchGig()"
          />
        </div>

        <div class="col-md-2">
          <select id="category" class="form-select" onchange="filterCategory()">
            <option value="">All Categories</option>

            <option value="Web Development">Web Development</option>

            <option value="Graphic Design">Graphic Design</option>

            <option value="Video Editing">Video Editing</option>

            <option value="Content Writing">Content Writing</option>

            <option value="AI Services">AI Services</option>
          </select>
        </div>

        <div class="col-md-2">
          <select id="category" class="form-select" onchange="filterCategory()">
            <option value="">All Categories</option>

            <option value="Web Development">Web Development</option>

            <option value="Graphic Design">Graphic Design</option>

            <option value="Video Editing">Video Editing</option>

            <option value="Content Writing">Content Writing</option>

            <option value="AI Services">AI Services</option>
          </select>
        </div>

        <div class="col-md-2">
          <select id="sortBy" class="form-select" onchange="sortGigs()">
            <option value="">Sort By</option>

            <option value="low">Price : Low to High</option>

            <option value="high">Price : High to Low</option>

            <option value="delivery">Fastest Delivery</option>

            <option value="title">A - Z</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <h5 id="resultCount"></h5>
      </div>
      <div class="row" id="gigContainer"></div>
    </div>

    <script src="16_marketplace.js"></script>
  </body>
</html>
